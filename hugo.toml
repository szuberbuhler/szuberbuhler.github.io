baseURL = 'https://szuberbuhler.com/'
locale = 'en-us'
title = 'Santos Zuberbuhler'
theme = 'PaperModX'

enableRobotsTXT = true

[params]
  author = 'Santos Zuberbuhler'
  description = 'Cybersecurity student · SOC / blue team focused. Labs, writeups and notes.'
  # Tema oscuro por defecto, con switch a claro
  defaultTheme = 'dark'
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = false
  # ToC flotante (ideal para writeups)
  TocSide = 'right'
  EnableInstantClick = true

  [params.profileMode]
    enabled = true
    title = 'Santos Zuberbuhler'
    subtitle = 'Cybersecurity student · SOC / blue team focused'
    # imageUrl se agrega cuando haya foto/avatar
    buttons = [
      { name = 'Writeups', url = '/writeups/' },
      { name = 'About', url = '/about/' }
    ]

[outputs]
  home = ['HTML', 'RSS', 'JSON']  # JSON para la búsqueda

[menu]
  [[menu.main]]
    identifier = 'writeups'
    name = 'Writeups'
    url = '/writeups/'
    weight = 1
  [[menu.main]]
    identifier = 'about'
    name = 'About'
    url = '/about/'
    weight = 2

[markup]
  [markup.highlight]
    style = 'dracula'
    lineNos = false
    codeFences = true
